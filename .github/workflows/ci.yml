name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Rust stable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Run Clippy
        run: cargo +stable clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo +stable test --locked
      - name: Check evaluation harness invariants
        run: |
          python3 -m py_compile evaluation/*.py
          python3 -m py_compile evaluation/debugging/*.py
          python3 -m unittest discover -s evaluation/tests -v
          python3 -m unittest discover -s evaluation/debugging/tests -v
      - name: Build release
        run: cargo +stable build --release --locked
      - name: Validate fixture benchmarks
        run: cargo +stable run --release --locked --example benchmark

  minimum-rust:
    name: Rust 1.74 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimum Rust version
        run: rustup toolchain install 1.74.0 --profile minimal
      - name: Test minimum Rust version
        run: cargo +1.74.0 test --locked
